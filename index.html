<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Kalam', cursive;
    background: #ffffff;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 16px;
}
.container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border: 3px solid #1a1a1a;
    border-radius: 4px;
}
.header {
    padding: 20px 16px 16px;
    text-align: center;
    border-bottom: 3px solid #1a1a1a;
}
.title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}
.title-row h1 {
    font-family: 'Caveat', cursive;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1;
}
.title-bug { width: 34px; height: 34px; flex-shrink: 0; }
.tagline {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    margin-top: 6px;
    color: #555;
}
.section {
    padding: 16px;
    border-bottom: 2px dashed #bbb;
}
.section-label {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
}
#jarLabel { justify-content: center; }
.drawn-heading {
    height: 44px;
    width: auto;
    max-width: 90%;
    display: block;
    margin: 2px auto 6px;
}
/* Bug jar */
.jar-wrap { display: flex; justify-content: center; }
.jar {
    position: relative;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 200 / 250;
}
.jar-body-layer { position: absolute; inset: 0; z-index: 1; }
.jar-body-layer svg { width: 100%; height: 100%; display: block; }
/* interior clip area where bugs/sticks live */
.jar-interior {
    position: absolute;
    left: 18%; right: 18%; top: 27%; bottom: 8%;
    overflow: hidden;
    z-index: 2;
}
.jar-lid {
    position: absolute;
    left: 18%; top: 2%; width: 64%;
    z-index: 4;
    transform-origin: 50% 130%;
    transition: transform 0.8s ease;
    pointer-events: none;
}
.jar-lid.open { transform: translate(46%, -60%) rotate(-26deg); }
.jar-lid svg { width: 100%; display: block; }
.jar-hand {
    position: absolute;
    right: -4%; top: -2%; width: 66%;
    z-index: 5;
    transform: translateX(135%);
    transition: transform 0.6s ease;
    opacity: 0;
    pointer-events: none;
}
.jar-hand.active { opacity: 1; }
.jar-hand svg { width: 100%; display: block; }
.jar-hand.grip { transform: translateX(12%); }
.jar-hand.lift { transform: translate(28%, -58%) rotate(-12deg); transition: transform 0.8s ease; }
.jar-bug {
    position: absolute;
    width: 24px; height: 24px;
    will-change: transform;
}
.jar-empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: 'Caveat', cursive; font-size: 20px; color: #999;
}
/* ambient motion keyframes */
@keyframes flyDrift {
    0%   { transform: translate(0,0) rotate(0deg); }
    20%  { transform: translate(18px,-14px) rotate(8deg); }
    45%  { transform: translate(-12px,-22px) rotate(-6deg); }
    70%  { transform: translate(22px,-8px) rotate(5deg); }
    100% { transform: translate(0,0) rotate(0deg); }
}
@keyframes flyDrift2 {
    0%   { transform: translate(0,0) rotate(0deg); }
    25%  { transform: translate(-20px,-18px) rotate(-7deg); }
    55%  { transform: translate(16px,-26px) rotate(9deg); }
    80%  { transform: translate(-10px,-10px) rotate(-4deg); }
    100% { transform: translate(0,0) rotate(0deg); }
}
@keyframes crawlLR {
    0%   { transform: translate(0,0) rotate(0deg) scaleX(1); }
    49%  { transform: translate(30px,-2px) rotate(2deg) scaleX(1); }
    50%  { transform: translate(30px,-2px) rotate(0deg) scaleX(-1); }
    99%  { transform: translate(0,2px) rotate(-2deg) scaleX(-1); }
    100% { transform: translate(0,0) rotate(0deg) scaleX(1); }
}
@keyframes crawlWiggle {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    25% { transform: translate(7px,-2px) rotate(3deg); }
    50% { transform: translate(13px,0) rotate(0deg); }
    75% { transform: translate(7px,2px) rotate(-3deg); }
}
@keyframes heroFlyIn {
    0%   { transform: translate(0,-120px) rotate(0deg); opacity: 0; }
    15%  { opacity: 1; }
    55%  { transform: translate(-14px,-30px) rotate(-10deg); }
    100% { transform: translate(0,0) rotate(0deg); }
}
@keyframes heroCrawlIn {
    0%   { transform: translate(0,-120px) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(0,0) rotate(0deg); }
}
.leftover-flies {
    text-align: center;
    font-family: 'Caveat', cursive;
    font-size: 20px;
    margin-top: 10px;
}
.leftover-flies .fly-count {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
/* Collection grid */
.collection {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 8px;
}
.spec {
    border: 2px solid #1a1a1a;
    border-radius: 3px;
    padding: 6px 4px 4px;
    text-align: center;
    background: #fff;
    position: relative;
}
.spec.locked { opacity: 0.28; }
.spec svg { width: 40px; height: 40px; }
.spec .spec-name {
    font-family: 'Caveat', cursive;
    font-size: 13px;
    line-height: 1.05;
    margin-top: 2px;
}
.spec .spec-count {
    position: absolute;
    top: -8px;
    right: -8px;
    background: #1a1a1a;
    color: #fff;
    font-family: 'Kalam', cursive;
    font-size: 12px;
    min-width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
}
/* Progress */
.progress-label {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}
.progress-label .next-bug { display: flex; align-items: center; gap: 6px; }
.progress-label .next-bug svg { width: 24px; height: 24px; }
.progress-bar {
    width: 100%;
    height: 14px;
    border: 2px solid #1a1a1a;
    border-radius: 8px;
    overflow: hidden;
    background: repeating-linear-gradient(45deg,#fff,#fff 4px,#eee 4px,#eee 8px);
}
.progress-fill {
    height: 100%;
    background: #1a1a1a;
    transition: width 0.4s ease;
}
/* Weekly total */
.weekly-total {
    text-align: center;
    font-family: 'Caveat', cursive;
    font-size: 24px;
    padding: 4px;
}
.weekly-total strong { font-size: 30px; }
/* Input */
.input-section {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
}
input[type="text"] {
    flex: 1;
    min-width: 140px;
    padding: 10px 12px;
    border: 2px solid #1a1a1a;
    border-radius: 3px;
    font-family: 'Kalam', cursive;
    font-size: 15px;
    background: #fff;
}
input[type="number"] {
    width: 64px;
    padding: 10px 6px;
    border: 2px solid #1a1a1a;
    border-radius: 3px;
    font-family: 'Kalam', cursive;
    font-size: 15px;
    text-align: center;
    background: #fff;
}
input:focus { outline: none; box-shadow: 3px 3px 0 #1a1a1a; }
.fly-label {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: 'Caveat', cursive;
    font-size: 18px;
}
.fly-label svg { width: 22px; height: 22px; }
button {
    padding: 10px 16px;
    background: #1a1a1a;
    color: #fff;
    border: 2px solid #1a1a1a;
    border-radius: 3px;
    font-family: 'Kalam', cursive;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}
button:active { transform: translate(2px,2px); }
/* Task list */
.task-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 2px solid #1a1a1a;
    border-radius: 3px;
    background: #fff;
    cursor: grab;
}
.task-item.dragging { opacity: 0.4; }
.task-item.completed { background: #f2f2f2; }
input[type="checkbox"] {
    width: 22px; height: 22px; cursor: pointer; flex-shrink: 0;
    accent-color: #1a1a1a;
}
.task-content { flex: 1; min-width: 0; }
.task-title { font-size: 16px; word-break: break-word; }
.task-item.completed .task-title { text-decoration: line-through; color: #888; }
.task-worth {
    font-family: 'Caveat', cursive;
    font-size: 16px; color: #555;
    display: flex; align-items: center; gap: 4px;
}
.task-worth svg { width: 18px; height: 18px; }
.delete-btn {
    background: #fff; color: #1a1a1a; padding: 6px 10px; font-size: 13px; flex-shrink: 0;
}
.empty-state {
    text-align: center; padding: 24px; font-family: 'Caveat', cursive; font-size: 20px; color: #999;
}
/* Daily tracker */
.day-log { display: flex; flex-direction: column; gap: 10px; }
.day-entry { border: 2px solid #1a1a1a; border-radius: 3px; padding: 8px 12px; }
.day-entry.today { border-width: 3px; background: #fafafa; }
.day-date { font-family: 'Caveat', cursive; font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.day-catch { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.catch-item { display: flex; align-items: center; gap: 3px; font-family: 'Caveat', cursive; font-size: 16px; }
.catch-item svg { width: 22px; height: 22px; }
.day-empty { font-family: 'Caveat', cursive; font-size: 16px; color: #999; }
/* Celebration */
.celebration-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: center; z-index: 1000;
    animation: fadeIn 0.3s;
}
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
.celebration-card {
    border: 3px solid #1a1a1a; border-radius: 4px; background: #fff;
    padding: 28px 32px; text-align: center; max-width: 340px;
    box-shadow: 8px 8px 0 #1a1a1a;
    animation: pop 0.4s ease-out;
}
@keyframes pop { from{transform:scale(0.7) rotate(-4deg);} to{transform:scale(1) rotate(0);} }
.celebration-card svg { width: 90px; height: 90px; animation: wiggle 0.6s ease-in-out; }
@keyframes wiggle { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-8deg);} 75%{transform:rotate(8deg);} }
.celebration-card h2 { font-family: 'Caveat', cursive; font-size: 30px; margin: 8px 0 4px; }
.celebration-card .cap { font-family: 'Caveat', cursive; font-size: 18px; color: #444; }
.celebration-card .fact { font-family: 'Kalam', cursive; font-size: 14px; margin-top: 12px; border-top: 2px dashed #bbb; padding-top: 10px; }
.celebration-card button { margin-top: 16px; }
</style>
</head>

function save(){
    localStorage.setItem('bug_tasks', JSON.stringify(tasks));
    localStorage.setItem('bug_totalFlies', String(totalFlies));
    localStorage.setItem('bug_dailyLog', JSON.stringify(dailyLog));
}
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// break a fly count into bug specimens, largest first, with leftover flies
function breakdown(flies){
    let rem = flies; const counts = {};
    for(let i=BUGS.length-1; i>=1; i--){
        const c = Math.floor(rem / BUGS[i].worth);
        if(c>0){ counts[i]=c; rem -= c*BUGS[i].worth; }
    }
    return { counts, leftover: rem };
}

// ---------- Rendering ----------
// hand-drawn stick lettering (SVG strokes) for headings
function letterPaths(ch, x){
    // coordinate guide: top=25, mid=57, bottom=90; letter box ~40 wide
    const P = d => '<path d="'+d+'" '+S+'/>';
    switch(ch){
        case 'Y': return P('M'+(x+5)+',25 L'+(x+21)+',56')+P('M'+(x+37)+',25 L'+(x+21)+',56')+P('M'+(x+21)+',56 L'+(x+21)+',90');
        case 'O': return P('M'+(x+21)+',24 C'+(x+43)+',24 '+(x+43)+',91 '+(x+21)+',91 C'+(x-1)+',91 '+(x-1)+',24 '+(x+21)+',24 Z');
        case 'U': return P('M'+(x+5)+',25 L'+(x+5)+',74 C'+(x+5)+',92 '+(x+37)+',92 '+(x+37)+',74 L'+(x+37)+',25');
        case 'R': return P('M'+(x+6)+',90 L'+(x+6)+',25')+P('M'+(x+6)+',25 C'+(x+36)+',24 '+(x+36)+',56 '+(x+6)+',55')+P('M'+(x+19)+',55 L'+(x+37)+',90');
        case 'B': return P('M'+(x+6)+',25 L'+(x+6)+',90')+P('M'+(x+6)+',25 C'+(x+34)+',24 '+(x+34)+',56 '+(x+6)+',56')+P('M'+(x+6)+',56 C'+(x+38)+',55 '+(x+38)+',91 '+(x+6)+',90');
        case 'G': return P('M'+(x+37)+',37 C'+(x+27)+',20 '+(x+4)+',26 '+(x+4)+',57 C'+(x+4)+',88 '+(x+31)+',93 '+(x+37)+',71 L'+(x+37)+',59 L'+(x+23)+',59');
        case 'J': return P('M'+(x+34)+',25 L'+(x+34)+',77 C'+(x+34)+',93 '+(x+9)+',93 '+(x+7)+',73');
        case 'A': return P('M'+(x+4)+',90 L'+(x+21)+',25 L'+(x+38)+',90')+P('M'+(x+12)+',65 L'+(x+30)+',65');
        default: return '';
    }
}
function drawnHeading(text){
    let x = 4, out = '';
    for(const ch of text){
        if(ch===' '){ x += 26; continue; }
        out += letterPaths(ch, x);
        x += 48;
    }
    const w = x + 4;
    return '<svg class="drawn-heading" viewBox="0 0 '+w+' 110" xmlns="http://www.w3.org/2000/svg">'+out+'</svg>';
}

roke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M70,50 C72,47 75,46 78,46" stroke="#1a1a1a" fill="none" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M78,46 l2,0 M78,46 l0,2" stroke="#1a1a1a" fill="none" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M60,51 l2,-1 M68,50 l2,0 M80,49 l2,-1" stroke="#1a1a1a" fill="none" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M14,50 C10,44 16,40 24,42 C30,44 30,50 24,52 C20,53 16,53 14,50 Z" stroke="#1a1a1a" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M15,50 C19,48 24,47 28,45" stroke="#1a1a1a" fill="none" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M18,49 l2,-2 M21,50 l2,-2 M24,50 l2,-2 M18,51 l2,1 M21,52 l2,1" stroke="#1a1a1a" fill="none" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M40,52 C42,46 50,45 54,49 C56,51 54,55 49,55 C45,55 41,55 40,52 Z" stroke="#1a1a1a" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M41,52 C46,51 51,50 54,49" stroke="#1a1a1a" fill="none" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M45,52 l2,-2 M49,52 l2,-2 M45,53 l2,1" stroke="#1a1a1a" fill="none" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M96,52 C98,48 104,47 108,50 C110,52 107,55 102,55 C99,55 97,54 96,52 Z" stroke="#1a1a1a" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M97,52 C101,51 105,50 108,50" stroke="#1a1a1a" fill="none" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round"/><path d="M100,52 l2,-2 M104,52 l1,-2" stroke="#1a1a1a" fill="none" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="34" cy="54" rx="4" ry="2.6" stroke="#1a1a1a" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M31,53 q3,-1 6,0" stroke="#1a1a1a" fill="none" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="90" cy="54" rx="3.2" ry="2.2" stroke="#1a1a1a" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M88,53 q2,-1 4,0" stroke="#1a1a1a" fill="none" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>'
        +'</svg>';
}
function leaf(x,y,rot){
    const ls='stroke="#1a1a1a" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"';
    const lv='stroke="#1a1a1a" fill="none" stroke-width="0.9" stroke-linecap="round"';
    return '<g transform="translate('+x+','+y+') rotate('+rot+')">'
        +'<path d="M0,0 Q5,-4 10,0 Q5,4 0,0 Z" '+ls+'/>'
        +'<path d="M1.5,0 H8.5" '+lv+'/></g>';
}

let ambientTimers = [];
function clearAmbient(){ ambientTimers.forEach(id=>clearTimeout(id)); ambientTimers = []; }

function fillJarInterior(){
    const interior = document.getElementById('jarInterior');
    if(!interior) return;
    clearAmbient();
    const { counts, leftover } = breakdown(totalFlies);
    // build list of specimen indices, largest first, capped
    const specimens = [];
    const keys = Object.keys(counts).map(Number).sort((a,b)=>b-a);
    keys.forEach(i=>{ for(let n=0;n<counts[i];n++) specimens.push(i); });
    for(let n=0;n<leftover;n++) specimens.push(0);
    const CAP = 16;
    const shown = specimens.slice(0, CAP);

    if(shown.length===0){
        interior.innerHTML = sticksLeavesSVG() + '<div class="jar-empty">Empty jar!<br>Finish a task \u2193</div>';
        return;
    }
    let html = sticksLeavesSVG();
    shown.forEach((idx, n)=>{
        const flyer = FLYERS.has(idx);
        // starting position (percent within interior)
        let top, left;
        if(flyer){ top = 14 + Math.random()*36; left = 20 + Math.random()*54; }
        else { top = 58 + Math.random()*26; left = 18 + Math.random()*56; }
        const size = 18 + Math.min(16, idx); // bigger bugs a touch larger
        html += '<span class="jar-bug" data-kind="'+(flyer?'fly':'crawl')+'" style="left:'+left+'%;top:'+top+'%;width:'+size+'px;height:'+size+'px;">'+BUGS[idx].svg+'</span>';
    });
    interior.innerHTML = html;
    // attach a random wandering animator to each bug
    interior.querySelectorAll('.jar-bug').forEach(el=>{
        animateBug(el, el.getAttribute('data-kind'));
    });
}

// each bug wanders to fresh random destinations, with its own speed & facing
function animateBug(el, kind){
    const interior = document.getElementById('jarInterior');
    if(!interior) return;
    el.style.transition = 'transform 2s ease-in-out';
    el._pos = { x:0, y:0 };
    function step(){
        if(!el.isConnected) return;
        const b = interior.getBoundingClientRect();
        const w = b.width || 220, h = b.height || 180;
        let dx, dy, dur, rot;
        if(kind==='fly'){
            dx = (Math.random()*2-1) * w*0.28;
            dy = (Math.random()*2-1) * h*0.22;
            dur = 1.6 + Math.random()*2.4;      // varied speed
            rot = (Math.random()*2-1)*18;
        } else {
            dx = (Math.random()*2-1) * w*0.32;
            dy = (Math.random()*2-1) * 8;       // crawlers stay low
            dur = 2.4 + Math.random()*3.0;      // slower
            rot = (Math.random()*2-1)*4;
        }
        const facing = dx < el._pos.x ? -1 : 1; // (kept for potential future use)
        el._pos = { x:dx, y:dy };
        el.style.transitionDuration = dur.toFixed(2)+'s';
        el.style.transform = 'translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px) rotate('+rot.toFixed(1)+'deg)';
        // occasionally pause a beat before the next hop, so it's not metronomic
        const pause = kind==='fly' ? Math.random()*250 : 200 + Math.random()*700;
        const id = setTimeout(step, dur*1000 + pause);
        ambientTimers.push(id);
    }
    const startId = setTimeout(step, Math.random()*900); // stagger starts
    ambientTimers.push(startId);
}

function renderJar(){
    if(!document.getElementById('jarInterior')) buildJarStructure();
    fillJarInterior();

    const lf = document.getElementById('leftoverFlies');
    const { leftover } = breakdown(totalFlies);
    if(totalFlies>0){
        lf.innerHTML = 'Total caught: <span class="fly-count">'+totalFlies+' <span class="title-bug" style="width:20px;height:20px;">'+BUGS[0].svg+'</span></span>'
        + (leftover>0 ? '  \u00b7  '+leftover+' loose fruit fl'+(leftover===1?'y':'ies') : '');
    } else { lf.innerHTML=''; }
}

// ---- earn animation: hand unscrews lid, bug enters, lid back on ----
let earnBusy = false;
function orchestrateEarn(idx, done){
    const lid = document.getElementById('jarLid');
    const hand = document.getElementById('jarHand');
    if(!lid || !hand){ fillJarInterior(); if(done) done(); return; }
    earnBusy = true;
    // 1) hand slides in to grip lid
    hand.classList.add('active');
    hand.classList.add('grip');
    setTimeout(()=>{
        // 2) open: lid + hand lift up/aside
        lid.classList.add('open');
        hand.classList.remove('grip'); hand.classList.add('lift');
    }, 650);
    setTimeout(()=>{
        // 3) refresh contents + hero bug flies/crawls in through the opening
        fillJarInterior();
        heroEntry(idx);
    }, 1550);
    setTimeout(()=>{
        // 4) close lid back on, hand returns to grip
        lid.classList.remove('open');
        hand.classList.remove('lift'); hand.classList.add('grip');
    }, 3150);
    setTimeout(()=>{
        // 5) hand retracts off-screen
        hand.classList.remove('grip');
    }, 4000);
    setTimeout(()=>{
        earnBusy = false;
        const hnd = document.getElementById('jarHand');
        if(hnd) hnd.classList.remove('active');
        if(done) done();
    }, 4650);
}

function heroEntry(idx){
    const interior = document.getElementById('jarInterior');
    if(!interior) return;
    const flyer = FLYERS.has(idx);
    const size = 22 + Math.min(16, idx);
    const restTop = flyer ? (16 + Math.random()*30) : (58 + Math.random()*26);
    const restLeft = 38 + Math.random()*18;
    const el = document.createElement('span');
    el.className = 'jar-bug';
    el.style.left = restLeft+'%';
    el.style.top = restTop+'%';
    el.style.width = size+'px';
    el.style.height = size+'px';
    el.style.animation = (flyer?'heroFlyIn':'heroCrawlIn')+' 1.4s ease-out forwards';
    el.innerHTML = BUGS[idx].svg;
    interior.appendChild(el);
    // after arrival, clear the entry keyframe and let it wander naturally
    setTimeout(()=>{
        if(!el.isConnected) return;
        el.style.animation = '';
        el.style.transform = 'none';
        animateBug(el, flyer ? 'fly' : 'crawl');
    }, 1450);
}

function nextBugInfo(){
    for(let i=1;i<BUGS.length;i++){
        if(totalFlies < BUGS[i].worth){
            const prev = BUGS[i-1].worth;
            const span = BUGS[i].worth - 0;
            return { bug:BUGS[i], needed:BUGS[i].worth-totalFlies, pct: Math.min(100,(totalFlies/BUGS[i].worth)*100) };
        }
    }
    return null;
}
function renderProgress(){
    const info = nextBugInfo();
    const label = document.getElementById('progressLabel');
    const fill = document.getElementById('progressFill');
    if(info){
        label.innerHTML = '<span class="next-bug">Next: '+info.bug.svg+' '+info.bug.name+'</span><span>'+info.needed+' to go</span>';
        fill.style.width = info.pct+'%';
    } else {
        label.innerHTML = '<span class="next-bug">'+BUGS[BUGS.length-1].svg+' Max bug reached!</span><span>\u2728</span>';
        fill.style.width='100%';
    }
}

function last7keys(){
    const arr=[]; const d=new Date();
    for(let i=0;i<7;i++){ const x=new Date(d); x.setDate(d.getDate()-i);
        arr.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')); }
    return arr;
}
function renderWeekly(){
    const keys = last7keys();
    let sum=0; keys.forEach(k=> sum += (dailyLog[k]||0));
    document.getElementById('weeklyTotal').innerHTML = 'This week you caught <strong>'+sum+'</strong> fruit fl'+(sum===1?'y':'ies')+'!';
}

function fmtDate(key){
    const [y,m,d]=key.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return days[dt.getDay()]+', '+mons[m-1]+' '+d;
}
function renderDayLog(){
    const log = document.getElementById('dayLog');
    const keys = last7keys();
    const tKey = todayKey();
    let html='';
    keys.forEach(k=>{
        const flies = dailyLog[k]||0;
        const isToday = k===tKey;
        let catchHtml='';
        if(flies>0){
            const {counts,leftover}=breakdown(flies);
            const ordered=Object.keys(counts).map(Number).sort((a,b)=>b-a);
            ordered.forEach(i=>{ catchHtml+='<span class="catch-item">'+BUGS[i].svg+' \u00d7'+counts[i]+'</span>'; });
            if(leftover>0) catchHtml+='<span class="catch-item">'+BUGS[0].svg+' \u00d7'+leftover+'</span>';
            catchHtml+='<span class="catch-item">('+flies+' total)</span>';
        } else {
            catchHtml='<span class="day-empty">'+(isToday?'Nothing yet today \u2014 go catch some!':'\u2014')+'</span>';
        }
        html+='<div class="day-entry'+(isToday?' today':'')+'"><div class="day-date">'+(isToday?'Today \u00b7 ':'')+fmtDate(k)+'</div><div class="day-catch">'+catchHtml+'</div></div>';
    });
    log.innerHTML=html;
}

function renderCollection(){
    const col=document.getElementById('collection');
    const {counts}=breakdown(totalFlies);
    // "ever earned" = highest tier reached historically via totalFlies; show a bug as unlocked if totalFlies>=worth
    let html='';
    BUGS.forEach((b,i)=>{
        const unlocked = totalFlies>=b.worth;
        const owned = counts[i]||0;
        html+='<div class="spec'+(unlocked?'':' locked')+'">'
            + (owned>0?'<span class="spec-count">'+owned+'</span>':'')
            + b.svg + '<div class="spec-name">'+b.name+'</div></div>';
    });
    col.innerHTML=html;
}

function renderTasks(){
    const list=document.getElementById('taskList');
    if(tasks.length===0){ list.innerHTML='<div class="empty-state">No tasks yet \u2014 add one above! \u2191</div>'; return; }
    list.innerHTML = tasks.map((t,idx)=>{
        return '<div class="task-item'+(draggedIndex===idx?' dragging':'')+(t.completed?' completed':'')+'" draggable="true" '
        +'ondragstart="dragStart('+idx+')" ondragover="dragOver(event)" ondrop="drop('+idx+')" ondragend="dragEnd()">'
        +'<input type="checkbox" '+(t.completed?'checked':'')+' onchange="toggleTask('+t.id+')">'
        +'<div class="task-content"><div class="task-title">'+escapeHtml(t.title)+'</div>'
        +'<div class="task-worth">worth '+t.flies+' '+BUGS[0].svg+' fruit fl'+(t.flies===1?'y':'ies')+'</div></div>'
        +'<button class="delete-btn" onclick="deleteTask('+t.id+')">Delete</button></div>';
    }).join('');
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderAll(){ renderJar(); renderProgress(); renderWeekly(); renderDayLog(); renderCollection(); renderTasks(); }

// ---------- Actions ----------
function addTask(){
    const input=document.getElementById('taskInput');
    const flyIn=document.getElementById('flyInput');
    const title=input.value.trim();
    let flies=parseInt(flyIn.value); if(isNaN(flies)||flies<1) flies=1;
    if(title){
        tasks.unshift({ id:Date.now(), title, flies, completed:false });
        input.value=''; flyIn.value='1'; save(); renderTasks(); input.focus();
    }
}
function toggleTask(id){
    const t=tasks.find(x=>x.id===id); if(!t) return;
    if(!t.completed){
        const before=totalFlies;
        totalFlies+=t.flies;
        const k=todayKey(); dailyLog[k]=(dailyLog[k]||0)+t.flies;
        t.completed=true; save();
        // update everything except the jar interior first
        renderProgress(); renderWeekly(); renderDayLog(); renderCollection(); renderTasks();
        if(!document.getElementById('jarInterior')) buildJarStructure();
        const earnedIdx = highestCrossed(before, totalFlies);
        if(earnedIdx!==null && !earnBusy){
            // leave jar showing pre-earn contents; animation opens lid, adds bug, then celebrates
            orchestrateEarn(earnedIdx, ()=>{ celebrate(BUGS[earnedIdx]); });
        } else {
            fillJarInterior();
            document.getElementById('leftoverFlies').innerHTML =
                'Total caught: <span class="fly-count">'+totalFlies+' <span class="title-bug" style="width:20px;height:20px;">'+BUGS[0].svg+'</span></span>'
                + (breakdown(totalFlies).leftover>0 ? '  \u00b7  '+breakdown(totalFlies).leftover+' loose fruit fl'+(breakdown(totalFlies).leftover===1?'y':'ies') : '');
        }
        return;
    }
    // unchecking does not remove flies already banked (kept simple & positive)
    t.completed=false; save(); renderAll();
}
function deleteTask(id){ tasks=tasks.filter(x=>x.id!==id); save(); renderTasks(); }

function highestCrossed(before, after){
    for(let i=BUGS.length-1;i>=1;i--){
        if(before<BUGS[i].worth && after>=BUGS[i].worth) return i;
    }
    return null;
}
function celebrate(bug){
    const el=document.getElementById('celebration');
    el.innerHTML='<div class="celebration-overlay" onclick="closeCelebrate()">'
    +'<div class="celebration-card" onclick="event.stopPropagation()">'
    +bug.svg+'<h2>New bug!</h2><div class="cap">You caught a '+bug.name+'!</div>'
    +'<div class="fact">'+bug.fact+'</div>'
    +'<button onclick="closeCelebrate()">Nice!</button></div></div>';
}
function closeCelebrate(){ document.getElementById('celebration').innerHTML=''; }

function dragStart(i){ draggedIndex=i; }
function dragOver(e){ e.preventDefault(); }
function drop(i){ if(draggedIndex!==null&&draggedIndex!==i){ const t=tasks[draggedIndex]; tasks.splice(draggedIndex,1); tasks.splice(i,0,t); save(); } draggedIndex=null; renderTasks(); }
function dragEnd(){ draggedIndex=null; renderTasks(); }

document.getElementById('taskInput').addEventListener('keypress',e=>{ if(e.key==='Enter'){ document.getElementById('flyInput').focus(); }});
document.getElementById('flyInput').addEventListener('keypress',e=>{ if(e.key==='Enter'){ addTask(); }});

renderTitle();
renderAll();
</script>
